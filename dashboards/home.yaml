title: Home
views:
  # ───────────────────────── HOME ─────────────────────────
  - title: Home
    path: home
    icon: mdi:home-variant
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-title-card
            title: "{{ 'Good morning' if now().hour < 12 else 'Good afternoon' if now().hour < 18 else 'Good evening' }}"
            subtitle: "{{ now().strftime('%A %-d %B') }}"
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: weather
                entity: weather.forecast_home
                show_conditions: true
                show_temperature: true
              - type: template
                icon: mdi:flash
                icon_color: amber
                content: "{{ states('sensor.daily_tracked_energy') }} kWh today"
              - type: template
                icon: mdi:currency-eur
                icon_color: green
                content: "€{{ states('sensor.daily_tracked_cost') }}"
              - type: template
                icon: mdi:car-electric
                icon_color: >-
                  {{ 'green' if states('sensor.ground_floor_blacky_battery_level')|int(0) > 40 else 'orange' if states('sensor.ground_floor_blacky_battery_level')|int(0) > 20 else 'red' }}
                content: >-
                  {{ states('sensor.ground_floor_blacky_battery_level') ~ '%' if has_value('sensor.ground_floor_blacky_battery_level') else 'asleep' }}
      - type: grid
        cards:
          - type: heading
            heading: Weather
            icon: mdi:weather-partly-cloudy
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            show_current: true
            show_forecast: true
      - type: grid
        cards:
          - type: heading
            heading: Blacky
            icon: mdi:car-electric
          - type: gauge
            entity: sensor.ground_floor_blacky_battery_level
            name: Battery
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 45
          - type: custom:mushroom-template-card
            primary: >-
              {{ (states('sensor.ground_floor_blacky_battery_range') | float(0) | round(0) | int ~ ' km range') if has_value('sensor.ground_floor_blacky_battery_range') else 'No data yet' }}
            secondary: >-
              {% if has_value('sensor.ground_floor_blacky_charging') %}
              {{ states('sensor.ground_floor_blacky_charging') | title }} ·
              {{ 'plugged in' if is_state('binary_sensor.ground_floor_blacky_charge_cable','on') else 'not plugged in' }}
              {% else %}Car is asleep. Tap to wake{% endif %}
            icon: mdi:ev-station
            icon_color: "{{ 'green' if is_state('binary_sensor.ground_floor_blacky_charge_cable','on') else 'disabled' }}"
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.ground_floor_blacky_wake
          - type: custom:mushroom-template-card
            primary: >-
              {{ 'Inside ' ~ states('sensor.ground_floor_blacky_inside_temperature') ~ '°C' if has_value('sensor.ground_floor_blacky_inside_temperature') else 'Inside --' }}
            secondary: >-
              {{ 'Outside ' ~ states('sensor.ground_floor_blacky_outside_temperature') ~ '°C' if has_value('sensor.ground_floor_blacky_outside_temperature') else 'Outside --' }}
            icon: mdi:thermometer
            icon_color: cyan
      - type: grid
        cards:
          - type: heading
            heading: Today
            icon: mdi:chart-donut
          - type: custom:mushroom-template-card
            primary: "€{{ states('sensor.daily_tracked_cost') }}"
            secondary: "{{ states('sensor.daily_tracked_energy') }} kWh tracked today"
            icon: mdi:cash-multiple
            icon_color: green
            layout: vertical
          - type: custom:mushroom-entity-card
            entity: switch.living_room
            name: Living room plug
            secondary_info: state
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.2nd_floor
            name: 2nd floor plug
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: input_boolean.vacation_mode
            name: Vacation mode
            icon_color: purple
            tap_action:
              action: toggle

  # ───────────────────────── ENERGY ─────────────────────────
  - title: Energy
    path: energy
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-title-card
            title: Energy
            subtitle: Tracked devices (P1 meter will join here)
      - type: grid
        cards:
          - type: heading
            heading: Right now
            icon: mdi:flash
          - type: custom:mini-graph-card
            name: Living room
            entities:
              - sensor.living_room_current_consumption
            hours_to_show: 24
            points_per_hour: 2
            line_width: 3
            animate: true
            color_thresholds:
              - value: 0
                color: "#2de2c8"
              - value: 150
                color: "#fbbf24"
              - value: 500
                color: "#fb7185"
            show:
              fill: fade
          - type: custom:mini-graph-card
            name: 2nd floor
            entities:
              - sensor.2nd_floor_current_consumption
            hours_to_show: 24
            points_per_hour: 2
            line_width: 3
            animate: true
            color_thresholds:
              - value: 0
                color: "#b388ff"
              - value: 150
                color: "#fbbf24"
              - value: 500
                color: "#fb7185"
            show:
              fill: fade
      - type: grid
        cards:
          - type: heading
            heading: Last 7 days
            icon: mdi:chart-bar
          - type: custom:apexcharts-card
            graph_type: bar
            header:
              show: true
              title: Plug energy per day (kWh)
              show_states: false
            span:
              end: day
            apex_config:
              chart:
                height: 260
              plotOptions:
                bar:
                  borderRadius: 6
              grid:
                borderColor: rgba(255,255,255,0.08)
            graph_span: 7d
            series:
              - entity: sensor.living_room_today_s_consumption
                name: Living room
                color: "#2de2c8"
                type: column
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.2nd_floor_today_s_consumption
                name: 2nd floor
                color: "#b388ff"
                type: column
                group_by:
                  func: max
                  duration: 1d
      - type: grid
        cards:
          - type: heading
            heading: This month
            icon: mdi:calendar-month
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.living_room_this_month_s_consumption') }} kWh"
            secondary: Living room plug
            icon: mdi:sofa
            icon_color: cyan
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.2nd_floor_this_month_s_consumption') }} kWh"
            secondary: 2nd floor plug
            icon: mdi:stairs-up
            icon_color: purple
          - type: custom:mushroom-template-card
            primary: "{{ states('input_number.electricity_price') }} €/kWh"
            secondary: Electricity price
            icon: mdi:currency-eur
            icon_color: green

  # ───────────────────────── HEATING ─────────────────────────
  - title: Heating
    path: heating
    icon: mdi:radiator
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:mushroom-title-card
            title: Heating
            subtitle: "Tado X · {{ states('sensor.kv_home_home_presence') | title }}"
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:calendar-refresh
                icon_color: green
                content: Resume schedules
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.kv_home_resume_schedules
              - type: template
                icon: mdi:fire
                icon_color: orange
                content: Boost all
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.kv_home_boost_all
              - type: template
                icon: mdi:power
                icon_color: red
                content: All off
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.kv_home_turn_off_all
              - type: template
                icon: mdi:battery-check
                icon_color: >-
                  {{ 'red' if expand('binary_sensor.vanne_bedroom_battery_low','binary_sensor.vanne_kiru_work_room_battery_low','binary_sensor.vanne_vini_work_room_battery_low','binary_sensor.thermostat_living_room_battery_low') | selectattr('state','eq','on') | list | count > 0 else 'green' }}
                content: >-
                  {{ 'Battery low' if expand('binary_sensor.vanne_bedroom_battery_low','binary_sensor.vanne_kiru_work_room_battery_low','binary_sensor.vanne_vini_work_room_battery_low','binary_sensor.thermostat_living_room_battery_low') | selectattr('state','eq','on') | list | count > 0 else 'Batteries OK' }}
              - type: template
                icon: mdi:api
                icon_color: >-
                  {{ 'red' if states('sensor.kv_home_home_api_quota_remaining') | int(1000) < 100 else 'blue' }}
                content: "API {{ states('sensor.kv_home_home_api_quota_remaining') }}/{{ states('sensor.kv_home_home_api_quota_limit') }}"
      - type: grid
        cards:
          - type: heading
            heading: Living room
            icon: mdi:sofa
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.living_room_temperature') | float(0) | round(1) }}°C
            secondary: >-
              💧 {{ states('sensor.living_room_humidity') | float(0) | round(0) | int }}% ·
              🔥 {{ states('sensor.living_room_heating_power') | float(0) | round(0) | int }}%
              {% if state_attr('climate.living_room','next_schedule_change') %}· next {{ state_attr('climate.living_room','next_schedule_temperature') }}° at {{ as_timestamp(state_attr('climate.living_room','next_schedule_change')) | timestamp_custom('%H:%M') }}{% endif %}
            icon: mdi:sofa
            icon_color: >-
              {{ 'red' if is_state('binary_sensor.living_room_heating','on') else 'orange' }}
            layout: horizontal
            badge_icon: >-
              {{ 'mdi:window-open-variant' if is_state('binary_sensor.living_room_window_open','on') else '' }}
            badge_color: blue
          - type: custom:mushroom-climate-card
            entity: climate.living_room
            show_temperature_control: true
            collapsible_controls: false
            hvac_modes:
              - heat
              - auto
              - "off"
      - type: grid
        cards:
          - type: heading
            heading: Bedroom
            icon: mdi:bed
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.bedroom_temperature') | float(0) | round(1) }}°C
            secondary: >-
              💧 {{ states('sensor.bedroom_humidity') | float(0) | round(0) | int }}% ·
              🔥 {{ states('sensor.bedroom_heating_power') | float(0) | round(0) | int }}%
              {% if state_attr('climate.bedroom','next_schedule_change') %}· next {{ state_attr('climate.bedroom','next_schedule_temperature') }}° at {{ as_timestamp(state_attr('climate.bedroom','next_schedule_change')) | timestamp_custom('%H:%M') }}{% endif %}
            icon: mdi:bed
            icon_color: >-
              {{ 'red' if is_state('binary_sensor.bedroom_heating','on') else 'purple' }}
            layout: horizontal
            badge_icon: >-
              {{ 'mdi:window-open-variant' if is_state('binary_sensor.bedroom_window_open','on') else '' }}
            badge_color: blue
          - type: custom:mushroom-climate-card
            entity: climate.bedroom
            show_temperature_control: true
            collapsible_controls: false
            hvac_modes:
              - heat
              - auto
              - "off"
      - type: grid
        cards:
          - type: heading
            heading: Kiru work room
            icon: mdi:desk
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.kiru_work_room_temperature') | float(0) | round(1) }}°C
            secondary: >-
              💧 {{ states('sensor.kiru_work_room_humidity') | float(0) | round(0) | int }}% ·
              🔥 {{ states('sensor.kiru_work_room_heating_power') | float(0) | round(0) | int }}%
              {% if state_attr('climate.kiru_work_room','next_schedule_change') %}· next {{ state_attr('climate.kiru_work_room','next_schedule_temperature') }}° at {{ as_timestamp(state_attr('climate.kiru_work_room','next_schedule_change')) | timestamp_custom('%H:%M') }}{% endif %}
            icon: mdi:desk
            icon_color: >-
              {{ 'red' if is_state('binary_sensor.kiru_work_room_heating','on') else 'cyan' }}
            layout: horizontal
            badge_icon: >-
              {{ 'mdi:window-open-variant' if is_state('binary_sensor.kiru_work_room_window_open','on') else '' }}
            badge_color: blue
          - type: custom:mushroom-climate-card
            entity: climate.kiru_work_room
            show_temperature_control: true
            collapsible_controls: false
            hvac_modes:
              - heat
              - auto
              - "off"
      - type: grid
        cards:
          - type: heading
            heading: Vini work room
            icon: mdi:desk-lamp
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.vini_work_room_temperature') | float(0) | round(1) }}°C
            secondary: >-
              💧 {{ states('sensor.vini_work_room_humidity') | float(0) | round(0) | int }}% ·
              🔥 {{ states('sensor.vini_work_room_heating_power') | float(0) | round(0) | int }}%
              {% if state_attr('climate.vini_work_room','next_schedule_change') %}· next {{ state_attr('climate.vini_work_room','next_schedule_temperature') }}° at {{ as_timestamp(state_attr('climate.vini_work_room','next_schedule_change')) | timestamp_custom('%H:%M') }}{% endif %}
            icon: mdi:desk-lamp
            icon_color: >-
              {{ 'red' if is_state('binary_sensor.vini_work_room_heating','on') else 'pink' }}
            layout: horizontal
            badge_icon: >-
              {{ 'mdi:window-open-variant' if is_state('binary_sensor.vini_work_room_window_open','on') else '' }}
            badge_color: blue
          - type: custom:mushroom-climate-card
            entity: climate.vini_work_room
            show_temperature_control: true
            collapsible_controls: false
            hvac_modes:
              - heat
              - auto
              - "off"

  # ───────────────────────── LAUNDRY ─────────────────────────
  - title: Laundry
    path: laundry
    icon: mdi:washing-machine
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:mushroom-title-card
            title: Laundry room
            subtitle: Washer and dryer
      - type: grid
        cards:
          - type: heading
            heading: Washer
            icon: mdi:washing-machine
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.laundry_room_laundry_room_washer_machine_state') | title }}"
            secondary: >-
              {{ states('sensor.laundry_room_laundry_room_washer_job_state') | replace('_',' ') | title }}
              {% if states('sensor.laundry_room_laundry_room_washer_completion_time') not in ['unknown','unavailable'] %}
              · done {{ as_timestamp(states('sensor.laundry_room_laundry_room_washer_completion_time')) | timestamp_custom('%H:%M') }}{% endif %}
            icon: mdi:washing-machine
            icon_color: "{{ 'cyan' if is_state('sensor.laundry_room_laundry_room_washer_machine_state','run') else 'disabled' }}"
            layout: vertical
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.daily_washer_energy') | float(0) | round(2) }} kWh today"
            secondary: "{{ states('sensor.daily_washer_water') | float(0) | round(0) | int }} L water today"
            icon: mdi:water
            icon_color: blue
      - type: grid
        cards:
          - type: heading
            heading: Dryer
            icon: mdi:tumble-dryer
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.laundry_room_kaayavekradhu_machine_state') | title }}"
            secondary: >-
              {{ states('sensor.laundry_room_kaayavekradhu_job_state') | replace('_',' ') | title }}
              {% if states('sensor.laundry_room_kaayavekradhu_completion_time') not in ['unknown','unavailable'] %}
              · done {{ as_timestamp(states('sensor.laundry_room_kaayavekradhu_completion_time')) | timestamp_custom('%H:%M') }}{% endif %}
            icon: mdi:tumble-dryer
            icon_color: "{{ 'orange' if is_state('sensor.laundry_room_kaayavekradhu_machine_state','run') else 'disabled' }}"
            layout: vertical
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.daily_dryer_energy') | float(0) | round(2) }} kWh today"
            secondary: "{{ states('sensor.laundry_room_kaayavekradhu_power') }} W now"
            icon: mdi:flash
            icon_color: amber

  # ───────────────────────── LIVING ROOM ─────────────────────────
  - title: Living room
    path: living-room
    icon: mdi:sofa
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:mushroom-title-card
            title: Living room
      - type: grid
        cards:
          - type: heading
            heading: Entertainment
            icon: mdi:television
          - type: custom:mushroom-media-player-card
            entity: media_player.vk_tv
            use_media_info: true
            show_volume_level: true
            volume_controls:
              - volume_mute
              - volume_set
              - volume_buttons
            media_controls:
              - on_off
              - play_pause_stop
      - type: grid
        cards:
          - type: heading
            heading: Power
            icon: mdi:power-plug
          - type: custom:mushroom-entity-card
            entity: switch.living_room
            name: Living room plug
            tap_action:
              action: toggle
          - type: custom:mini-graph-card
            name: Plug draw (24h)
            entities:
              - sensor.living_room_current_consumption
            hours_to_show: 24
            line_width: 3
            animate: true
            show:
              fill: fade
